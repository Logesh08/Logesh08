name: Generate GitHub Contribution Snake

on:
  schedule:
    - cron: '30 18,0,6,12 * * *'  # 00:00/06:00/12:00/18:00 IST
  workflow_dispatch:

jobs:
  generate-snake:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Ensure assets folder
        run: mkdir -p assets

      # First attempt
      - name: Generate snake (attempt #1)
        id: snake1
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            assets/github-snake.svg
            assets/github-snake-dark.svg?palette=github-dark
        continue-on-error: true

      # Check if the file actually exists
      - name: Did we get snake.svg?
        id: check1
        run: |
          if [ -f assets/github-snake.svg ]; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      # Retry if first failed
      - name: Generate snake (attempt #2)
        if: steps.check1.outputs.found == 'false'
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            assets/github-snake.svg
            assets/github-snake-dark.svg?palette=github-dark
        continue-on-error: true

      # Final check
      - name: Final snake check
        run: |
          if [ ! -f assets/github-snake.svg ]; then
            echo "❌ Snake generation failed after 2 attempts."
            exit 1
          fi

      - name: Commit & push snake
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add assets/github-snake*.svg
          git commit -m "chore: update GitHub snake" || echo "No changes to commit"
          git push
