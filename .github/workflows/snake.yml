name: Generate GitHub Contribution Snake

on:
  schedule:
    # Every day at midnight UTC
    # - cron: '0 0 * * *'
    # at 00:00, 06:00, 12:00 & 18:00 IST
    - cron: '30 18,0,6,12 * * *'
    # Same as  above but UTC version
    # - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

jobs:
  generate-snake:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      # 1) checkout your code
      - uses: actions/checkout@v3

      # 2) generate the snake SVGs
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-snake.svg
            assets/github-snake-dark.svg?palette=github-dark

      # 3) commit + push the updated assets back to your repo
      - name: Commit and push
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add assets/github-snake*.svg
          git commit -m "chore: update GitHub snake"
          git push
